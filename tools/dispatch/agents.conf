# =============================================================
# agents.conf — 各AIを「人が操作しなくても動く」形で起動するコマンド
#
# - 指示書の中身は、各作業場所（git worktree）の .dispatch_task.md に置かれます
#   （Windows では複数行の日本語をコマンドの引数で渡すと途中で切れるため、ファイルで渡す）
# - 各AIには、下の $TASK_LINE（1行の英語の指示）だけを渡します
# - コマンドは各タスクの作業場所の中で実行されます。自動承認の範囲はその中だけに絞ること
#
# ★ フラグ名はCLIのバージョンで変わることがあります。各CLIの --help で確認してください。
# =============================================================

# 基準ブランチ（空なら今いるブランチ）
BASE_BRANCH=""

# 作業場所（worktree）を作る場所（空ならリポジトリの隣に <名前>-worktrees/ を作る）
WT_ROOT=""

# Godot の実行ファイル。各AIには $GODOT として渡る（AGENTS.md の確認手順で使う）
# Windows（Git Bash）の例: GODOT_BIN="/c/Tools/Godot/Godot_v4.7.2-stable_win64_console.exe"
# Mac の例:               GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
GODOT_BIN="godot"

# 1タスクの制限時間（秒）。超えたら止めて「失敗」にする（承認待ちで止まったままになるのを防ぐ）
TASK_TIMEOUT=1800

# 各AIに渡す1行の指示（英語・1行にしておくと、どのOSでも途中で切れない）
TASK_LINE='Read the file .dispatch_task.md in the current directory and follow its instructions exactly. Write your final report in Japanese.'

# Claude Code: -p で非対話実行。acceptEdits はファイル編集だけ自動で許可
CLAUDE_CMD='claude -p "$TASK_LINE" --permission-mode acceptEdits'

# Codex CLI: exec で非対話実行。--full-auto は作業場所の中での書き込みを自動で許可
CODEX_CMD='codex exec --full-auto "$TASK_LINE"'

# Gemini CLI: -p で非対話実行。--yolo は操作を自動で許可（作業場所の中だけで使うこと）
GEMINI_CMD='gemini --yolo -p "$TASK_LINE"'

# Muse Code: exec で非対話実行。自動承認のフラグは `muse exec --help` で確認して追記
MUSE_CMD='muse exec "$TASK_LINE"'
